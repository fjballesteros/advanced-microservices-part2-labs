# Candidate release: same application binary, different configuration/version marker.
# Isolated selector: does not receive stable Service traffic until promotion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-green
  labels:
    app.kubernetes.io/name: orders-green
    app.kubernetes.io/part-of: advanced-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-green
        app.kubernetes.io/part-of: advanced-orders
        training.release-group: orders
        training.release-track: green
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders
          image: advms26acr4366001b.azurecr.io/advancedorders/orders:0.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-config
          env:
            - name: APP_VERSION
              value: "0.3.0-green"
            - name: INVENTORY_BASE_URL
              value: "http://inventory:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "160Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-green
  labels:
    app.kubernetes.io/name: orders-green
    app.kubernetes.io/part-of: advanced-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-green
  ports:
    - name: http
      port: 8080
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: advanced-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: advanced-orders
        app.kubernetes.io/version: "0.2.1-rate"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: advms26acr4366001b.azurecr.io/advancedorders/api-gateway:0.2.1-rate
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 10001
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "160Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          envFrom:
            - configMapRef:
                name: gateway-routing
            - configMapRef:
                name: p05-security-settings
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "p05-security,p05-rate-limit"
            - name: P05_RATE_LIMIT_REQUESTS
              value: "3"
            - name: P05_RATE_LIMIT_WINDOW_SECONDS
              value: "10"
          # JVM initialization can exceed the liveness window on shared CPU.
          # Until startup succeeds, Kubernetes does not run readiness/liveness.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 48
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
